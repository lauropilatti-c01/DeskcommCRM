name: C01 atendimento — baseline e RLS (opcional)

# Só roda por chamada explícita. Não publica, não acessa dados ou segredos reais.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  percurso:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: c01_p2_ci
        ports:
          - 55441:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d c01_p2_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
      postgrest:
        image: postgrest/postgrest:v16.5
        env:
          PGRST_DB_URI: postgresql://postgres:postgres@postgres:5432/c01_p2_ci
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: c01-isolated-synthetic-verification-key-only-2310
        ports:
          - 55442:3000
    env:
      C01_P2_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55441/c01_p2_ci
      C01_P2_POSTGREST_URL: http://127.0.0.1:55442
      C01_P2_JWT_SECRET: c01-isolated-synthetic-verification-key-only-2310
      C01_P2_INSTALL_BASELINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: Cliente PostgreSQL para instalar o baseline
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Provar rotas, permissões e continuidade no baseline integral
        run: bash scripts/test-c01-atendimento-baseline.sh
